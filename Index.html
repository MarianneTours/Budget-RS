<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes de frais</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', sans-serif;
  background: #f5f4f0;
  color: #1a1916;
  min-height: 100vh;
}

/* HEADER */
header {
  background: #fff;
  border-bottom: 1px solid #e2e0d8;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  gap: 10px;
}

.logo { display: flex; align-items: center; gap: 10px; }
.logo-icon {
  width: 32px; height: 32px;
  background: #2563eb; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: white; font-size: 16px; flex-shrink: 0;
}
.logo h1 { font-size: 14px; font-weight: 600; }
.logo p  { font-size: 11px; color: #888; }

.btn-reset {
  background: none;
  border: 1px solid #e2e0d8;
  color: #888;
  padding: 7px 12px;
  border-radius: 7px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  white-space: nowrap;
  flex-shrink: 0;
}
.btn-reset:hover { background: #fee2e2; border-color: #dc2626; color: #dc2626; }

/* MAIN */
main { max-width: 640px; margin: 0 auto; padding: 16px 14px 80px; }

/* TOTAL BAR */
.total-bar {
  background: #fff;
  border: 1px solid #e2e0d8;
  border-radius: 12px;
  padding: 16px 18px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  box-shadow: 0 1px 4px rgba(0,0,0,.06);
}

.total-left .lbl { font-size: 11px; color: #888; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; }
.total-left .num { font-size: 28px; font-weight: 700; letter-spacing: -.02em; }

.btn-receipt {
  background: #c8102e;
  color: white;
  border: none;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  display: flex; align-items: center; gap: 6px;
  white-space: nowrap;
}
.btn-receipt:hover { background: #a50d26; }

.btn-export {
  background: #2563eb;
  color: white;
  border: none;
  padding: 10px 16px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  display: flex; align-items: center; gap: 6px;
}
.btn-export:hover { background: #1d4ed8; }

/* ADD PANEL */
.add-panel {
  background: #fff;
  border: 1px solid #e2e0d8;
  border-radius: 12px;
  margin-bottom: 14px;
  overflow: hidden;
  box-shadow: 0 1px 4px rgba(0,0,0,.06);
}

.add-toggle-btn {
  width: 100%;
  background: none;
  border: none;
  padding: 15px 18px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  font-weight: 600;
  color: #1a1916;
  text-align: left;
}
.add-toggle-btn:hover { background: #f5f4f0; }

.add-toggle-btn .arrow {
  margin-left: auto;
  font-size: 20px;
  color: #2563eb;
  font-weight: 700;
  transition: transform .2s;
  line-height: 1;
}
.add-toggle-btn.open .arrow { transform: rotate(45deg); }

/* THE FORM — hidden by default */
.add-form-wrap {
  display: none;
  padding: 0 18px 18px;
  flex-direction: column;
  gap: 12px;
  border-top: 1px solid #e2e0d8;
}
.add-form-wrap.open { display: flex; }

/* Photo zone */
.photo-zone {
  border: 2px dashed #d1d0c8;
  border-radius: 10px;
  padding: 18px 14px;
  text-align: center;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: border-color .2s;
}
.photo-zone:hover { border-color: #2563eb; background: #eff6ff; }
.photo-zone input {
  position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
}
.photo-zone .pz-icon { font-size: 26px; }
.photo-zone .pz-text { font-size: 13px; color: #666; margin-top: 4px; }
.photo-zone .pz-sub  { font-size: 11px; color: #aaa; margin-top: 2px; }

.photo-preview {
  width: 100%;
  max-height: 160px;
  object-fit: contain;
  border-radius: 8px;
  border: 1px solid #e2e0d8;
  display: none;
  margin-top: 8px;
}
.photo-preview.show { display: block; }

/* Fields */
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 420px) { .row2 { grid-template-columns: 1fr; } }

.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: .05em; }
.field input,
.field select,
.field textarea {
  background: #f5f4f0;
  border: 1px solid #dddbd3;
  border-radius: 7px;
  padding: 9px 11px;
  font-size: 13px;
  font-family: 'Inter', sans-serif;
  color: #1a1916;
  outline: none;
  width: 100%;
}
.field input:focus,
.field select:focus,
.field textarea:focus {
  border-color: #2563eb;
  background: #fff;
}
.field textarea { resize: vertical; min-height: 56px; }

.btn-add {
  background: #2563eb;
  color: white;
  border: none;
  padding: 12px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  margin-top: 4px;
}
.btn-add:hover { background: #1d4ed8; }

/* LIST */
.list-label {
  font-size: 11px;
  font-weight: 600;
  color: #888;
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: 8px;
  padding-left: 2px;
}

.receipt-card {
  background: #fff;
  border: 1px solid #e2e0d8;
  border-radius: 12px;
  padding: 13px 15px;
  display: flex;
  gap: 12px;
  margin-bottom: 10px;
  box-shadow: 0 1px 4px rgba(0,0,0,.05);
}

.thumb {
  width: 52px; height: 52px;
  border-radius: 8px;
  border: 1px solid #e2e0d8;
  flex-shrink: 0;
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  background: #f5f4f0;
  cursor: pointer;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; }

.card-body { flex: 1; min-width: 0; }

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 5px;
}
.card-desc {
  font-size: 14px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card-amount { font-size: 15px; font-weight: 700; flex-shrink: 0; }

.card-meta { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }

.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 8px; border-radius: 20px;
  font-size: 11px; font-weight: 600;
}

.card-date { font-size: 11px; color: #888; }
.card-note { font-size: 11px; color: #888; font-style: italic; }

.card-actions { display: flex; gap: 6px; margin-top: 8px; }

.btn-xs {
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid #dddbd3;
  background: #f5f4f0;
  color: #666;
  font-family: 'Inter', sans-serif;
}
.btn-xs:hover { background: #e2e0d8; color: #1a1916; }
.btn-xs.del:hover { background: #fee2e2; border-color: #dc2626; color: #dc2626; }

/* EMPTY */
.empty {
  text-align: center;
  padding: 50px 20px;
  color: #aaa;
}
.empty .e-icon { font-size: 38px; margin-bottom: 12px; }
.empty .e-title { font-size: 15px; font-weight: 600; color: #555; margin-bottom: 6px; }
.empty .e-sub { font-size: 13px; }

/* MODALS */
.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.55);
  display: none; align-items: center; justify-content: center;
  z-index: 200; padding: 16px;
}
.overlay.show { display: flex; }

.modal {
  background: #fff;
  border-radius: 14px;
  width: 100%; max-width: 460px;
  max-height: 90vh; overflow-y: auto;
}
.modal-head {
  padding: 15px 18px;
  border-bottom: 1px solid #e2e0d8;
  display: flex; justify-content: space-between; align-items: center;
}
.modal-head h3 { font-size: 15px; font-weight: 600; }
.modal-close {
  width: 28px; height: 28px; border-radius: 50%;
  border: none; background: #f5f4f0;
  cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
}
.modal-body { padding: 18px; }
.modal-body img { width: 100%; border-radius: 8px; }

.export-fields { display: flex; flex-direction: column; gap: 12px; }
.export-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }
.btn-cancel {
  background: #f5f4f0; border: 1px solid #dddbd3;
  color: #555; padding: 10px 16px; border-radius: 8px;
  font-size: 13px; font-weight: 600; cursor: pointer;
  font-family: 'Inter', sans-serif;
}

/* TOAST */
.toast {
  position: fixed; bottom: 20px; left: 50%;
  transform: translateX(-50%) translateY(70px);
  background: #1a1916; color: #fff;
  padding: 10px 20px; border-radius: 24px;
  font-size: 13px; font-weight: 500;
  z-index: 300; white-space: nowrap;
  transition: transform .3s cubic-bezier(.34,1.56,.64,1);
  pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* ROAD SCHOLAR RECEIPT */
.rs-receipt {
  font-family: 'Inter', sans-serif;
  max-width: 420px;
  margin: 0 auto;
}
.rs-logo {
  text-align: center;
  margin-bottom: 4px;
}
.rs-logo-title {
  font-size: 22px;
  font-weight: 900;
  color: #c8102e;
  letter-spacing: .02em;
  font-style: italic;
}
.rs-logo-sub {
  font-size: 11px;
  color: #555;
  font-style: italic;
  margin-top: 1px;
}
.rs-title {
  text-align: center;
  font-size: 16px;
  font-weight: 700;
  border-top: 2px solid #c8102e;
  border-bottom: 2px solid #c8102e;
  padding: 5px 0;
  margin: 10px 0;
  letter-spacing: .08em;
}
.rs-field-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 10px;
}
.rs-field-row label {
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  flex-shrink: 0;
}
.rs-field-row input {
  flex: 1;
  border: none;
  border-bottom: 1px solid #aaa;
  background: none;
  font-size: 13px;
  font-family: 'Inter', sans-serif;
  padding: 2px 4px;
  outline: none;
  color: #1a1916;
}
.rs-field-row input:focus { border-bottom-color: #2563eb; }

.rs-acknowledge {
  font-size: 12px;
  margin: 12px 0 6px;
  line-height: 1.5;
}
.rs-amount-desc {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 8px;
}
.rs-box {
  border: 1px dashed #aaa;
  border-radius: 4px;
  padding: 6px 8px;
  min-height: 44px;
  display: flex;
  align-items: center;
}
.rs-box input, .rs-box textarea {
  border: none;
  background: none;
  width: 100%;
  font-size: 13px;
  font-family: 'Inter', sans-serif;
  outline: none;
  resize: none;
  color: #1a1916;
}

.rs-service-text {
  font-size: 11px;
  color: #444;
  margin-bottom: 14px;
  line-height: 1.4;
}

.rs-sig-grid {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px 12px;
  align-items: end;
  margin-bottom: 12px;
}
.rs-sig-label {
  font-size: 10px;
  color: #666;
  margin-top: 4px;
}
.rs-sig-wrap {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.rs-sig-canvas {
  border-bottom: 1px solid #aaa;
  border-radius: 4px;
  background: #fafaf8;
  cursor: crosshair;
  display: block;
  touch-action: none;
}
.rs-date-input {
  border: none;
  border-bottom: 1px solid #aaa;
  background: none;
  font-size: 12px;
  font-family: 'Inter', sans-serif;
  padding: 2px 2px;
  outline: none;
  width: 90px;
  color: #1a1916;
}
.rs-clear-sig {
  font-size: 10px;
  color: #888;
  background: none;
  border: none;
  cursor: pointer;
  text-decoration: underline;
  padding: 0;
  font-family: 'Inter', sans-serif;
  text-align: right;
}
.rs-save-btn {
  width: 100%;
  background: #c8102e;
  color: white;
  border: none;
  padding: 12px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  margin-top: 8px;
  letter-spacing: .03em;
}
.rs-save-btn:hover { background: #a50d26; }


/* Handwriting rows */
.rs-hw-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.rs-hw-label {
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  flex-shrink: 0;
  min-width: 120px;
}
.rs-hw-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.rs-hw-canvas {
  width: 100% !important;
  height: 40px !important;
}
.rs-hw-box-wrap {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.rs-hw-sublabel {
  font-size: 10px;
  color: #888;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .04em;
}

/* Overlay canvases on receipt image */
.rs-overlay-canvas {
  position: absolute;
  background: transparent;
  cursor: crosshair;
  touch-action: none;
  border: 1.5px dashed rgba(37,99,235,0.35);
  border-radius: 3px;
  box-sizing: border-box;
  transition: border-color .15s, background .15s;
}
.rs-overlay-canvas.active {
  border-color: rgba(37,99,235,0.8);
  background: rgba(219,234,254,0.18);
}
#receiptContainer { touch-action: none; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🧾</div>
    <div>
      <h1>Notes de frais</h1>
      <p>Tickets & justificatifs</p>
    </div>
  </div>
  <button class="btn-reset" onclick="newMission()">🔄 Nouvelle mission</button>
</header>

<main>

  <!-- Total bar -->
  <div class="total-bar">
    <div class="total-left">
      <div class="lbl">Total remboursable</div>
      <div class="num" id="total">0,00 €</div>
      <div style="font-size:11px;color:#888;margin-top:3px" id="count-info">0 ticket</div>
    </div>
    <button class="btn-receipt" onclick="openReceipt()">✍️ Reçu signé</button>
    <button class="btn-export" onclick="openExport()">📄 Exporter PDF</button>
  </div>

  <!-- Add panel -->
  <div class="add-panel">
    <button class="add-toggle-btn" id="toggleBtn" onclick="toggleForm()">
      <span>➕</span>
      <span>Ajouter un ticket</span>
      <span class="arrow">+</span>
    </button>

    <div class="add-form-wrap" id="addForm">

      <!-- Photo -->
      <div class="field" style="margin-top:4px">
        <label>Photo du ticket (optionnel)</label>
        <div class="photo-zone" id="photoZone">
          <input type="file" id="photoInput" accept="image/*" capture="environment">
          <div class="pz-icon">📷</div>
          <div class="pz-text">Appuyer pour prendre une photo ou importer</div>
          <div class="pz-sub">JPG, PNG</div>
        </div>
        <img id="photoPreview" class="photo-preview" alt="aperçu">
      </div>

      <div class="row2">
        <div class="field">
          <label>Description *</label>
          <input type="text" id="fDesc" placeholder="ex. Déjeuner" maxlength="80">
        </div>
        <div class="field">
          <label>Montant (€) *</label>
          <input type="number" id="fAmount" placeholder="0.00" min="0" step="0.01">
        </div>
      </div>

      <div class="row2">
        <div class="field">
          <label>Catégorie *</label>
          <select id="fCat">
            <option value="day1">📅 Jour 1</option>
            <option value="day2">📅 Jour 2</option>
            <option value="day3">📅 Jour 3</option>
            <option value="day4">📅 Jour 4</option>
            <option value="day5">📅 Jour 5</option>
            <option value="day6">📅 Jour 6</option>
            <option value="day7">📅 Jour 7</option>
            <option value="day8">📅 Jour 8</option>
            <option value="day9">📅 Jour 9</option>
            <option value="day10">📅 Jour 10</option>
            <option value="day11">📅 Jour 11</option>
            <option value="day12">📅 Jour 12</option>
            <option value="day13">📅 Jour 13</option>
            <option value="day14">📅 Jour 14</option>
            <option value="day15">📅 Jour 15</option>
            <option value="day16">📅 Jour 16</option>
            <option value="day17">📅 Jour 17</option>
            <option value="day18">📅 Jour 18</option>
            <option value="bank">🏦 Bank withdrawal</option>
            <option value="contingency">⚠️ Contingency</option>
            <option value="additional">➕ Additional</option>
          </select>
        </div>
        <div class="field">
          <label>Date *</label>
          <input type="date" id="fDate">
        </div>
      </div>

      <div class="field">
        <label>Notes (optionnel)</label>
        <textarea id="fNotes" placeholder="Détails, noms, objet..."></textarea>
      </div>

      <button class="btn-add" onclick="addReceipt()">✅ Ajouter ce ticket</button>

    </div>
  </div>

  <!-- List -->
  <div class="list-label">Tickets enregistrés</div>
  <div id="list"></div>

</main>

<!-- Photo modal -->
<div class="overlay" id="photoModal" onclick="closeModal('photoModal')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-head">
      <h3 id="photoModalTitle">Photo</h3>
      <button class="modal-close" onclick="closeModal('photoModal')">×</button>
    </div>
    <div class="modal-body">
      <img id="photoModalImg" src="" alt="">
    </div>
  </div>
</div>

<!-- Export modal -->
<div class="overlay" id="exportModal" onclick="closeModal('exportModal')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-head">
      <h3>Exporter en PDF</h3>
      <button class="modal-close" onclick="closeModal('exportModal')">×</button>
    </div>
    <div class="modal-body">
      <div class="export-fields">
        <div class="field">
          <label>Ton nom</label>
          <input type="text" id="eName" placeholder="Marie Dupont">
        </div>
        <div class="field">
          <label>Période / mission</label>
          <input type="text" id="ePeriod" placeholder="Juin 2026 — Circuit Bretagne">
        </div>
        <div class="field">
          <label>Société destinataire</label>
          <input type="text" id="eCompany" placeholder="Tourisme SA">
        </div>
        <div class="export-actions">
          <button class="btn-cancel" onclick="closeModal('exportModal')">Annuler</button>
          <button class="btn-export" onclick="generatePDF()">📄 Générer PDF</button>
        </div>
      </div>
    </div>
  </div>
</div>


<!-- Road Scholar Receipt Modal -->
<div class="overlay" id="receiptModal" onclick="closeModal('receiptModal')">
  <div class="modal" style="max-width:500px;max-height:95vh;display:flex;flex-direction:column" onclick="event.stopPropagation()">
    <div class="modal-head" style="flex-shrink:0;display:flex;justify-content:space-between;align-items:center">
      <h3>Reçu Road Scholar</h3>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn-xs" onclick="clearFullCanvas()" style="font-size:11px">🗑 Effacer</button>
        <button class="modal-close" onclick="closeModal('receiptModal')">×</button>
      </div>
    </div>
    <div style="padding:10px 12px 4px;flex-shrink:0;font-size:11px;color:#888;text-align:center">
      ✏️ Écris directement sur le formulaire avec ton stylet
    </div>
    <div style="flex:1;overflow-y:auto;padding:0 12px 12px">

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>

const CATS = {
  day1: { icon:'📅', label:'Jour 1', color:'#2563eb', bg:'#eff6ff' },
  day2: { icon:'📅', label:'Jour 2', color:'#0891b2', bg:'#ecfeff' },
  day3: { icon:'📅', label:'Jour 3', color:'#7c3aed', bg:'#f5f3ff' },
  day4: { icon:'📅', label:'Jour 4', color:'#db2777', bg:'#fdf2f8' },
  day5: { icon:'📅', label:'Jour 5', color:'#16a34a', bg:'#f0fdf4' },
  day6: { icon:'📅', label:'Jour 6', color:'#f97316', bg:'#fff7ed' },
  day7: { icon:'📅', label:'Jour 7', color:'#ca8a04', bg:'#fefce8' },
  day8: { icon:'📅', label:'Jour 8', color:'#dc2626', bg:'#fee2e2' },
  day9: { icon:'📅', label:'Jour 9', color:'#0d9488', bg:'#f0fdfa' },
  day10: { icon:'📅', label:'Jour 10', color:'#6366f1', bg:'#eef2ff' },
  day11: { icon:'📅', label:'Jour 11', color:'#84cc16', bg:'#f7fee7' },
  day12: { icon:'📅', label:'Jour 12', color:'#f43f5e', bg:'#fff1f2' },
  day13: { icon:'📅', label:'Jour 13', color:'#8b5cf6', bg:'#f5f3ff' },
  day14: { icon:'📅', label:'Jour 14', color:'#06b6d4', bg:'#ecfeff' },
  day15: { icon:'📅', label:'Jour 15', color:'#10b981', bg:'#f0fdf4' },
  day16: { icon:'📅', label:'Jour 16', color:'#f59e0b', bg:'#fffbeb' },
  day17: { icon:'📅', label:'Jour 17', color:'#ef4444', bg:'#fef2f2' },
  day18: { icon:'📅', label:'Jour 18', color:'#3b82f6', bg:'#eff6ff' },
  bank:        { icon:'🏦', label:'Bank withdrawal', color:'#374151', bg:'#f3f4f6' },
  contingency: { icon:'⚠️', label:'Contingency',     color:'#d97706', bg:'#fffbeb' },
  additional:  { icon:'➕', label:'Additional',      color:'#059669', bg:'#ecfdf5' },
};

let receipts = [];
try { receipts = JSON.parse(localStorage.getItem('receipts') || '[]'); } catch(e) { receipts = []; }

let currentPhoto = null;

// Init date
document.getElementById('fDate').value = todayStr();

// Photo input listener
document.getElementById('photoInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    currentPhoto = ev.target.result;
    const prev = document.getElementById('photoPreview');
    prev.src = currentPhoto;
    prev.classList.add('show');
    document.querySelector('#photoZone .pz-icon').textContent = '✅';
    document.querySelector('#photoZone .pz-text').textContent = 'Photo chargée — re-cliquer pour changer';
  };
  reader.readAsDataURL(file);
});

render();

// ── Toggle form ──
function toggleForm() {
  const form = document.getElementById('addForm');
  const btn  = document.getElementById('toggleBtn');
  const isOpen = form.classList.toggle('open');
  btn.classList.toggle('open', isOpen);
}

// ── Add receipt ──
function addReceipt() {
  const desc   = (document.getElementById('fDesc').value || '').trim();
  const rawAmt = document.getElementById('fAmount').value;
  const amount = parseFloat(rawAmt);
  const cat    = document.getElementById('fCat').value;
  const date   = document.getElementById('fDate').value;
  const notes  = (document.getElementById('fNotes').value || '').trim();

  if (!desc)              { toast('⚠️ Ajoute une description');  return; }
  if (!rawAmt || isNaN(amount) || amount <= 0) { toast('⚠️ Montant invalide'); return; }
  if (!date)              { toast('⚠️ Sélectionne une date');    return; }

  receipts.push({ id: Date.now(), num: nextNum(), desc, amount, cat, date, notes, photo: currentPhoto });
  save();
  resetForm();
  render();
  toast('✅ Ticket ajouté !');

  // Close form
  document.getElementById('addForm').classList.remove('open');
  document.getElementById('toggleBtn').classList.remove('open');
}

function resetForm() {
  document.getElementById('fDesc').value   = '';
  document.getElementById('fAmount').value = '';
  document.getElementById('fNotes').value  = '';
  document.getElementById('fCat').value    = 'day1';
  document.getElementById('fDate').value   = todayStr();
  document.getElementById('photoPreview').classList.remove('show');
  document.getElementById('photoPreview').src = '';
  document.getElementById('photoInput').value = '';
  document.querySelector('#photoZone .pz-icon').textContent = '📷';
  document.querySelector('#photoZone .pz-text').textContent = 'Appuyer pour prendre une photo ou importer';
  currentPhoto = null;
}

// ── Delete ──
function deleteReceipt(id) {
  if (!confirm('Supprimer ce ticket ?')) return;
  receipts = receipts.filter(r => r.id !== id);
  save();
  render();
  toast('🗑️ Supprimé');
}

// ── New mission ──
function newMission() {
  if (receipts.length === 0) { toast('ℹ️ Aucun ticket'); return; }
  if (!confirm('Effacer les ' + receipts.length + ' ticket(s) et repartir à zéro ?\n\nExporte ton PDF avant !')) return;
  receipts = [];
  save();
  render();
  toast('✅ Nouvelle mission !');
}

// ── Render ──
function render() {
  const total = receipts.reduce((s,r) => s + r.amount, 0);
  document.getElementById('total').textContent = eur(total);
  document.getElementById('count-info').textContent = receipts.length + ' ticket' + (receipts.length !== 1 ? 's' : '');

  const sorted = [...receipts].sort((a,b) => b.date.localeCompare(a.date));
  const list = document.getElementById('list');

  if (sorted.length === 0) {
    list.innerHTML = '<div class="empty"><div class="e-icon">🧾</div><div class="e-title">Aucun ticket pour l\'instant</div><div class="e-sub">Appuie sur « Ajouter un ticket » pour commencer</div></div>';
    return;
  }

  list.innerHTML = sorted.map(function(r) {
    const cat = CATS[r.cat] || CATS.autre;
    const thumbInner = r.photo
      ? '<img src="' + r.photo + '" alt="ticket">'
      : cat.icon;
    const thumbClick = r.photo ? 'onclick="viewPhoto(' + r.id + ')"' : '';

    return '<div class="receipt-card">'
      + '<div class="thumb" ' + thumbClick + '>' + thumbInner + '</div>'
      + '<div class="card-body">'
      + '<div class="card-top">'
      + '<span class="card-desc" title="' + esc(r.desc) + '">' + esc(r.desc) + '</span>'
      + '<span class="card-amount">' + eur(r.amount) + '</span>'
      + '</div>'
      + '<div class="card-meta">'
      + '<span class="badge" style="color:' + cat.color + ';background:' + cat.bg + '">' + cat.icon + ' ' + cat.label + '</span>'
      + '<span class="card-date">📅 ' + fmtDate(r.date) + '</span>'
      + (r.notes ? '<span class="card-note">💬 ' + esc(r.notes.substring(0,40)) + (r.notes.length>40?'…':'') + '</span>' : '')
      + '</div>'
      + '<div class="card-actions">'
      + (r.photo ? '<button class="btn-xs" onclick="viewPhoto(' + r.id + ')">👁 Voir photo</button>' : '')
      + '<button class="btn-xs del" onclick="deleteReceipt(' + r.id + ')">🗑 Supprimer</button>'
      + '</div>'
      + '</div>'
      + '</div>';
  }).join('');
}

// ── View photo ──
function viewPhoto(id) {
  const r = receipts.find(function(x) { return x.id === id; });
  if (!r || !r.photo) return;
  document.getElementById('photoModalImg').src = r.photo;
  document.getElementById('photoModalTitle').textContent = r.desc;
  document.getElementById('photoModal').classList.add('show');
}

// ── Export modal ──
function openExport() {
  if (receipts.length === 0) { toast('⚠️ Aucun ticket à exporter'); return; }
  document.getElementById('exportModal').classList.add('show');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('show');
}

// ── PDF ──
function generatePDF() {
  var jsPDF = window.jspdf.jsPDF;
  var doc = new jsPDF({ orientation:'p', unit:'mm', format:'a4' });

  var name    = (document.getElementById('eName').value || '').trim() || 'Nom non renseigné';
  var period  = (document.getElementById('ePeriod').value || '').trim();
  var company = (document.getElementById('eCompany').value || '').trim();

  var PW = 210, PH = 297, M = 18, CW = 210 - 18*2;
  var y = M;
  var sorted = receipts.slice().sort(function(a,b){ return a.date.localeCompare(b.date); });
  var total  = receipts.reduce(function(s,r){ return s + r.amount; }, 0);

  // Header
  doc.setFillColor(37,99,235);
  doc.rect(0,0,PW,36,'F');
  doc.setTextColor(255,255,255);
  doc.setFont('helvetica','bold');
  doc.setFontSize(16);
  doc.text('Note de frais', M, 16);
  doc.setFontSize(9);
  doc.setFont('helvetica','normal');
  doc.text(name, M, 24);
  if (period) doc.text(period, M, 30);
  if (company) doc.text('Destinataire : ' + company, PW-M, 24, { align:'right' });
  doc.text('Généré le ' + new Date().toLocaleDateString('fr-FR'), PW-M, 30, { align:'right' });

  y = 46;
  doc.setTextColor(30,30,30);

  // Summary
  doc.setFillColor(239,246,255);
  doc.roundedRect(M, y, CW, 16, 3, 3, 'F');
  doc.setFont('helvetica','bold');
  doc.setFontSize(10);
  doc.text('Total : ' + eur(total) + '   —   ' + receipts.length + ' ticket(s)', M+6, y+10);

  y += 24;

  // Table header
  doc.setFillColor(245,244,240);
  doc.rect(M, y, CW, 8, 'F');
  doc.setFont('helvetica','bold');
  doc.setFontSize(8);
  doc.setTextColor(120,120,120);
  var c = [M+2, M+26, M+84, M+116, M+136];
  doc.text('DATE',       c[0], y+5.5);
  doc.text('#  DESCRIPTION',c[1], y+5.5);
  doc.text('CATÉGORIE',  c[2], y+5.5);
  doc.text('NOTES',      c[3], y+5.5);
  doc.text('MONTANT',    c[4], y+5.5);
  doc.setTextColor(30,30,30);
  y += 10;

  doc.setFont('helvetica','normal');
  doc.setFontSize(8.5);

  for (var i = 0; i < sorted.length; i++) {
    var r = sorted[i];
    var cat = CATS[r.cat] || CATS.autre;

    if (y > PH - 40) { doc.addPage(); y = M + 10; }

    if (i % 2 === 0) {
      doc.setFillColor(252,252,250);
      doc.rect(M, y-2, CW, 10, 'F');
    }

    doc.text(fmtDate(r.date), c[0], y+4);
    var numStr = '#' + (r.num||'?') + ' ';
    doc.setFont('helvetica','bold');
    doc.text(numStr, c[1], y+4);
    doc.setFont('helvetica','normal');
    var nw = doc.getTextWidth(numStr);
    var desc = r.desc.length > 20 ? r.desc.substring(0,18)+'…' : r.desc;
    doc.text(desc, c[1]+nw, y+4);
    doc.text(cat.label, c[2], y+4);
    doc.setTextColor(120,120,120);
    var note = r.notes ? (r.notes.length>20 ? r.notes.substring(0,18)+'…' : r.notes) : '—';
    doc.text(note, c[3], y+4);
    doc.setTextColor(30,30,30);
    doc.setFont('helvetica','bold');
    doc.text(eur(r.amount), PW-M-2, y+4, { align:'right' });
    doc.setFont('helvetica','normal');
    y += 10;

    // Photo
    if (r.photo) {
      if (y > PH - 80) { doc.addPage(); y = M; }
      try {
        var fmt = r.photo.indexOf('data:image/png') === 0 ? 'PNG' : 'JPEG';
        doc.addImage(r.photo, fmt, M, y, 60, 45);
        doc.setFontSize(7.5);
        doc.setTextColor(140,140,140);
        doc.text('Justificatif : ' + r.desc + ' — ' + fmtDate(r.date), M, y+47);
        doc.setTextColor(30,30,30);
        doc.setFontSize(8.5);
        y += 54;
      } catch(e) {}
    }
  }

  // Total line
  if (y > PH-30) { doc.addPage(); y = M; }
  doc.setDrawColor(200,200,200);
  doc.line(M, y+2, PW-M, y+2);
  y += 8;
  doc.setFont('helvetica','bold');
  doc.setFontSize(11);
  doc.text('TOTAL', c[1], y+4);
  doc.text(eur(total), PW-M-2, y+4, { align:'right' });

  // Footer
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFont('helvetica','normal');
    doc.setFontSize(7.5);
    doc.setTextColor(160,160,160);
    doc.text('Note de frais — ' + name + ' — Page ' + p + '/' + pages, PW/2, PH-8, { align:'center' });
  }

  var fname = 'note-de-frais-' + name.replace(/\s+/g,'_') + '-' + todayStr() + '.pdf';
  doc.save(fname);
  closeModal('exportModal');
  toast('📄 PDF exporté !');
}

// ── Helpers ──
function eur(n) {
  return new Intl.NumberFormat('fr-FR', { style:'currency', currency:'EUR' }).format(n);
}
function fmtDate(iso) {
  if (!iso) return '—';
  var p = iso.split('-');
  return p[2] + '/' + p[1] + '/' + p[0];
}
function todayStr() {
  return new Date().toISOString().split('T')[0];
}
function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function nextNum() {
  var max = 0;
  receipts.forEach(function(r) { if ((r.num||0) > max) max = r.num; });
  return max + 1;
}

function save() {
  localStorage.setItem('receipts', JSON.stringify(receipts));
}
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2800);
}

// ── Road Scholar Receipt ──────────────────────────────────
var fullCtx = null;
var fullDrawing = false;

function openReceipt() {
  document.getElementById('receiptModal').classList.add('show');
  setTimeout(function() {
    initFullCanvas();
  }, 120);
}

function clearFullCanvas() {
  if (!fullCtx) return;
  var c = document.getElementById('fullDrawCanvas');
  fullCtx.clearRect(0, 0, c.width, c.height);
}

function initFullCanvas() {
  var canvas = document.getElementById('fullDrawCanvas');
  var img = document.getElementById('receiptBg');
  if (!canvas || !img) return;

  var dpr = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  canvas.style.width  = rect.width  + 'px';
  canvas.style.height = rect.height + 'px';

  fullCtx = canvas.getContext('2d');
  fullCtx.scale(dpr, dpr);
  fullCtx.strokeStyle = '#1a1916';
  fullCtx.lineWidth = 1.8;
  fullCtx.lineCap = 'round';
  fullCtx.lineJoin = 'round';

  // Remove old listeners by cloning
  var newCanvas = canvas.cloneNode(false);
  newCanvas.width = canvas.width;
  newCanvas.height = canvas.height;
  canvas.parentNode.replaceChild(newCanvas, canvas);
  var c2 = newCanvas;
  fullCtx = c2.getContext('2d');
  fullCtx.scale(dpr, dpr);
  fullCtx.strokeStyle = '#1a1916';
  fullCtx.lineWidth = 1.8;
  fullCtx.lineCap = 'round';
  fullCtx.lineJoin = 'round';

  function getPos(e) {
    var r = c2.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return { x: src.clientX - r.left, y: src.clientY - r.top };
  }
  function start(e) {
    e.preventDefault(); e.stopPropagation();
    fullDrawing = true;
    var pos = getPos(e);
    fullCtx.beginPath();
    fullCtx.moveTo(pos.x, pos.y);
  }
  function move(e) {
    e.preventDefault(); e.stopPropagation();
    if (!fullDrawing) return;
    var pos = getPos(e);
    fullCtx.lineTo(pos.x, pos.y);
    fullCtx.stroke();
    fullCtx.beginPath();
    fullCtx.moveTo(pos.x, pos.y);
  }
  function end(e) { fullDrawing = false; }

  c2.addEventListener('mousedown',  start);
  c2.addEventListener('mousemove',  move);
  c2.addEventListener('mouseup',    end);
  c2.addEventListener('mouseleave', end);
  c2.addEventListener('touchstart', start, { passive: false });
  c2.addEventListener('touchmove',  move,  { passive: false });
  c2.addEventListener('touchend',   end);
}

function saveReceipt() {
  var drawCanvas = document.getElementById('fullDrawCanvas');
  var bgImg = document.getElementById('receiptBg');

  // Check something was drawn
  var isEmpty = true;
  if (drawCanvas) {
    var d = drawCanvas.getContext('2d').getImageData(0, 0, drawCanvas.width, drawCanvas.height).data;
    for (var i = 3; i < d.length; i += 4) { if (d[i] > 0) { isEmpty = false; break; } }
  }
  if (isEmpty) { toast('⚠️ Remplis le formulaire avant d\'enregistrer'); return; }

  // Composite: bg image + drawing
  var tmpCanvas = document.createElement('canvas');
  tmpCanvas.width  = bgImg.naturalWidth;
  tmpCanvas.height = bgImg.naturalHeight;
  var ctx = tmpCanvas.getContext('2d');
  ctx.drawImage(bgImg, 0, 0);

  // Scale drawing onto bg
  var contRect = document.getElementById('receiptContainer').getBoundingClientRect();
  var scaleX = bgImg.naturalWidth  / contRect.width;
  var scaleY = bgImg.naturalHeight / contRect.height;
  ctx.drawImage(drawCanvas,
    0, 0, drawCanvas.width, drawCanvas.height,
    0, 0, bgImg.naturalWidth, bgImg.naturalHeight);

  // Stamp receipt number
  var sn = nextNum();
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(26,25,22,0.82)';
  var bw = 90, bh = 32;
  ctx.fillRect(bgImg.naturalWidth - bw - 8, 8, bw, bh);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 20px Arial, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('#' + sn, bgImg.naturalWidth - 12, 8+bh-8);
  ctx.textAlign = 'left';

  var imgData = tmpCanvas.toDataURL('image/jpeg', 0.92);


function drawLine(ctx, x1, y1, x2, y2) {
  ctx.beginPath();
  ctx.strokeStyle = '#bbb';
  ctx.lineWidth = 1;
  ctx.setLineDash([]);
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
  var words = text.split(' ');
  var line = '';
  for (var i = 0; i < words.length; i++) {
    var test = line + words[i] + ' ';
    if (ctx.measureText(test).width > maxWidth && i > 0) {
      ctx.fillText(line, x, y);
      line = words[i] + ' ';
      y += lineHeight;
    } else { line = test; }
  }
  ctx.fillText(line, x, y);
}
